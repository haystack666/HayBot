/* UI proposal only: synthetic data, no network requests or production mutations. */
(() => {
  const name = () => window.prototypeBotName || '林诗语';

  const tag = (text, color = '') => `<span class="tag ${color}">${text}</span>`;
  const note = text => `<p class="muted" style="font-size:12px;line-height:1.7;margin:8px 0 0">${text}</p>`;
  const card = (title, body, action = '') => `<section class="card"><div class="card-head row between"><h3>${title}</h3>${action}</div>${body}</section>`;

  const select = (label, items, hint = '') => `<label class="field"><span>${label}</span><select class="input">${items.map(i => `<option>${i}</option>`).join('')}</select>${hint ? `<small class="muted">${hint}</small>` : ''}</label>`;
  const toggle = (title, hint, on = true) => `<label class="list-row row between"><span><strong>${title}</strong>${note(hint)}</span><input class="demo-switch" type="checkbox" aria-label="${title}" ${on ? 'checked' : ''} /></label>`;
  const save = () => note('修改后可在底部统一保存；演示设置不会影响真实 Bot。');

  const list = (title, sub, right = '') => `<div class="list-row row between"><div><strong>${title}</strong>${note(sub)}</div>${right}</div>`;
  const toolbar = (left, right = '') => `<div class="toolbar row between">${left}<div class="row">${right}</div></div>`;
  const scope = (text = 'Owner · 私聊') => `<label class="row"><span class="muted">当前范围</span><select class="input" data-scope="memory" aria-label="内容所属用户" style="width:auto"><option value="owner">${text}</option><option value="user-a">普通用户 · 演示用户 A</option></select></label>`;
  const baseline = `<div class="row" style="padding:12px 16px;background:var(--soft,#f3f5f1);border-radius:10px;font-size:12px">${tag('统一身份','green')}<span>名字和已确认的 Owner 关系始终一致；不同场景只改变表达方式。</span></div>`;
  const memoryRows = [
    ['共同经历','一起讨论过周末拍摄雨后街景的想法。','10 月 28 日 · 私聊','memory-detail'],
    ['兴趣偏好','主人喜欢安静的城市散步和自然风景。','10 月 27 日 · 私聊','memory-detail'],
    ['未来约定','周六傍晚挑选一部电影，时间尚未最终确定。','10 月 26 日 · 私聊','memory-detail'],

  ];
  const days = ['10 月 28 日','10 月 27 日','10 月 26 日'];

  window.secondaryViews = {
    persona(tab = 'identity') {
      const identity = `${baseline}<div class="grid-2">${card('她是谁', `<div class="form-grid">${input('角色名字',name())}${input('平台昵称',name()==='林诗语'?'诶嘿':'大肥鱼')}${area('基础人格','有自己的观察和想法，表达自然，愿意倾听。对熟悉的人会亲近，也会坦率说出不同意见。','Owner 对话使用这份基础人格。公开人格不会覆盖身份。',5)}</div>`)}${card('表达与兴趣',`${list('角色兴趣','由用户填写；手机任务按当前请求选择使用。',tag('独立偏好'))}${list('任务偏好与筛选','角色兴趣、主人偏好和内容筛选集中在手机任务设置。',btn('统一管理','data-route="phone/settings"'))}<div class="divider"></div>${list('公开表达','群聊与平台评论分别设置。',btn('设置','data-tab="public"'))}`)}</div>${save()}`;

});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();search()}if(e.key==='Escape')closeOverlay();if(e.key==='Tab'&&$('.overlay')){const els=[...$('.overlay').querySelectorAll('button,input,select,textarea,a,[tabindex]')].filter(x=>!x.disabled&&x.offsetParent!==null);const first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});
