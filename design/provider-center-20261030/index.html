let toastTimer;function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3200)}
function setView(next,group){view=next;category=group||(next==='catalog'?'chat':'all');query='';statusFilter='all';render()}
function render(){document.querySelectorAll('[data-view]').forEach(e=>{e.classList.toggle('active',e.dataset.view===view);e.setAttribute('aria-current',e.dataset.view===view?'page':'false')});document.getElementById('connection-count').textContent=connections.length;document.getElementById('catalog-count').textContent=catalog.length;document.getElementById('test-all').style.visibility=view==='connections'?'visible':'hidden';const root=document.getElementById('page-content');if(view==='assignments'){root.innerHTML=renderAssignments();bindAssignments()}else{root.innerHTML=`<div class="content-layout"><aside class="filters" aria-label="按用途筛选">${filterMarkup()}<p class="filter-note">${icon('layers')}同一服务可以添加多个连接，分别使用不同账号或订阅计划。</p></aside><section class="main-content"><div class="mobile-categories" aria-label="按用途筛选">${filterMarkup()}</div><div id="results"></div></section></div>`;document.querySelectorAll('[data-category]').forEach(el=>el.onclick=()=>{category=el.dataset.category;query='';render()});renderResults()}icons()}
function filterMarkup(){const source=view==='catalog'?catalog:connections.map(c=>service(c.service));return Object.entries(groups).map(([id,g])=>`<button class="filter ${category===id?'active':''}" data-category="${id}" aria-pressed="${category===id}">${icon(g.icon)}<span>${id==='all'?(view==='catalog'?'全部服务':'全部连接'):g.name}</span><span class="n">${id==='all'?source.length:source.filter(s=>s.group===id).length}</span></button>`).join('')}
function filtered(){const source=view==='catalog'?catalog:connections;return source.filter(item=>{const s=view==='catalog'?item:service(item.service);return(category==='all'||s.group===category)&&(!query||`${s.name} ${item.name} ${item.model||''} ${s.group} ${s.tag||''} ${s.id} ${s.id.startsWith('xiaomi')?'小米 mino mimo':''}`.toLowerCase().includes(query.toLowerCase()))&&(view==='catalog'||statusFilter==='all'||item.status===statusFilter)})}
function toolbar(n){return `<div class="toolbar"><div class="search">${icon('search')}<input id="provider-search" aria-label="搜索供应商" placeholder="${view==='catalog'?'搜索服务、品牌或计划…':'搜索连接名称、服务或模型…'}" value="${escapeHTML(query)}"></div>${view==='connections'?`<select id="status-filter" aria-label="连接状态"><option value="all">全部状态</option><option value="good" ${statusFilter==='good'?'selected':''}>已验证</option><option value="warn" ${statusFilter==='warn'?'selected':''}>待检查</option><option value="muted" ${statusFilter==='muted'?'selected':''}>未测试</option></select>`:''}<span class="result-count">${n} ${view==='catalog'?'种服务':'个连接'}</span></div>`}
function renderResults(){const list=filtered();document.getElementById('results').innerHTML=(view==='catalog'?`<div class="directory-intro"><div><h2>${category==='all'?'选择要连接的服务':groups[category].name}</h2><p>选择服务类型，再配置连接。普通 API 与订阅计划分别管理。</p></div></div>`:'')+toolbar(list.length)+(view==='catalog'?renderCatalog(list):renderConnections(list));const search=document.getElementById('provider-search');search.oninput=()=>{const pos=search.selectionStart;query=search.value;renderResults();const input=document.getElementById('provider-search');input.focus();input.setSelectionRange(pos,pos)};const status=document.getElementById('status-filter');if(status)status.onchange=()=>{statusFilter=status.value;renderResults()};document.querySelectorAll('[data-service]').forEach(el=>el.onclick=()=>openEditor(el.dataset.service));document.querySelectorAll('[data-edit]').forEach(el=>{el.onclick=()=>openEditor(connections.find(c=>c.id===el.dataset.edit).service,el.dataset.edit);el.onkeydown=e=>{if(e.key==='Enter')el.click()}});icons(document.getElementById('results'))}
function renderConnections(list){if(!list.length)return `<div class="connection-list empty">${icon('search')}<h3>${query?'没有找到匹配的连接':'还没有这类连接'}</h3><p>${query?'换个关键词，或检查筛选条件。':'从服务目录选择一个供应商开始。'}</p><button class="btn sm" style="margin-top:15px" onclick="setView('catalog','${category}')">浏览服务目录 ${icon('arrow')}</button></div>`;return `<div class="connection-list"><div class="list-head"><span>连接名称 / 服务</span><span class="model-column">默认模型</span><span class="usage-column">使用范围</span><span>连接状态</span><span></span></div>${list.map(c=>{const s=service(c.service);return `<div class="connection-row" data-edit="${c.id}" tabindex="0" role="button" aria-label="编辑 ${escapeHTML(c.name)}"><div class="connection-identity"><span class="service-mark">${escapeHTML(s.mark)}</span><span class="identity-text"><b>${escapeHTML(c.name)}</b><small>${escapeHTML(s.name)} <span style="padding:0 4px">·</span> ${titleGroup(s.group)}</small></span></div><div class="cell-model model-column">${escapeHTML(c.model)}<small>${s.group==='tts'?'音色 · '+escapeHTML(c.voice||'默认音色'):s.tag||'默认配置'}</small></div><div class="usage usage-column">${c.bots.length?c.bots.length+' 个机器人':'尚未分配'}<small>${c.bots.length?c.bots.length>1?escapeHTML(c.bots.slice(0,2).join('、')):escapeHTML(c.bots[0]):'保存后可分配给机器人'}</small></div><span class="status ${c.status}"><span class="dot"></span>${{good:'已验证',warn:'待检查',muted:'未测试'}[c.status]}</span><span class="icon-btn" aria-hidden="true">${icon('more')}</span></div>`}).join('')}</div><div class="list-foot">${icon('lock')}凭证在连接中统一管理。修改共享连接前，可在详情中查看受影响的机器人。</div>`}
function renderCatalog(list){if(!list.length)return `<div class="connection-list empty">${icon('search')}<h3>没有找到这个服务</h3><p>试试品牌名称、TTS、STT 或 Token Plan。</p></div>`;return purposeKeys.map(g=>{const items=list.filter(s=>s.group===g);if(!items.length)return '';return `<section class="catalog-section">${category==='all'?`<div class="section-heading">${icon(groups[g].icon)}${groups[g].name}<small>${items.length} 种</small></div>`:''}<div class="catalog-grid">${items.map(s=>`<button class="service-card" data-service="${s.id}" aria-label="添加 ${escapeHTML(s.name)}"><span class="card-top"><span class="service-mark">${escapeHTML(s.mark)}</span><h3>${escapeHTML(s.name)}</h3><span class="card-arrow">${icon('arrow')}</span></span><p>${escapeHTML(s.description)}</p>${s.tag?`<span class="badge plan">${s.tag}</span>`:''}</button>`).join('')}</div></section>`}).join('')}
function renderAssignments(){const a=assignment();const row=(g,title,desc)=>`<div class="assignment-row"><div><b>${title}</b><small>${desc}</small></div><label><span class="field-label">使用连接</span><select data-slot="${g}" aria-label="${title}连接"><option value="">暂不使用</option>${connections.filter(c=>service(c.service).group===g).map(c=>`<option value="${c.id}" ${a[g]===c.id?'selected':''}>${escapeHTML(c.name)}</option>`).join('')}</select></label><label class="model-field"><span class="field-label">${g==='tts'?'音色':'模型'}</span><input aria-label="${title}${g==='tts'?'音色':'模型'}" value="${escapeHTML(a[g+'Value']||connections.find(c=>c.id===a[g])?.[g==='tts'?'voice':'model']||'')}" placeholder="${g==='tts'?'选择或填写音色 ID':'选择或填写模型名称'}" data-slot-value="${g}"></label></div>`;return `<div class="assignment-top"><div class="bot-switch"><label for="assignment-bot">当前机器人</label><select id="assignment-bot">${['林诗语','大肥鱼','mimi-haybot'].map(b=>`<option ${selectedBot===b?'selected':''}>${b}</option>`).join('')}</select></div><button class="btn ghost sm" id="manage-connections">管理连接 ${icon('arrow')}</button></div><p class="assignment-caption">为当前机器人选择连接与模型。切换机器人，不会改变其他机器人的设置。</p><section class="assignment-section"><header class="assignment-heading"><span class="icon-wrap">${icon('chat')}</span><div><h2>对话</h2><small>日常聊天与图片理解使用的主模型</small></div></header>${row('chat','对话模型','聊天、看图与角色回复')}</section><section class="assignment-section"><header class="assignment-heading"><span class="icon-wrap">${icon('speaker')}</span><div><h2>语音</h2><small>识别收到的语音，选择回复时使用的声音</small></div></header>${row('tts','语音合成 TTS','将回复文字转换为语音')}${row('stt','语音识别 STT','将收到的语音转换为文字')}<div class="assignment-voice-actions"><button type="button" class="switch" id="voice-reply" role="switch" aria-label="允许语音回复" aria-checked="${a.voiceEnabled}"></button><div><span style="font-size:11px">允许语音回复</span><p>接收语音识别与回复语音可以分别开启。</p></div></div></section><section class="assignment-section"><header class="assignment-heading"><span class="icon-wrap">${icon('brain')}</span><div><h2>记忆与检索</h2><small>沿用现有 Embedding 与 Rerank 配置</small></div></header>${row('embedding','Embedding','整理和检索长期记忆')}${row('rerank','Rerank','可选，优化检索结果顺序')}</section><footer class="assignment-footer"><small id="assignment-status">${assignmentDirty?'有未保存的分配修改':'设置仅作用于 '+selectedBot}</small><button class="btn" id="reset-assignment">撤销更改</button><button class="btn primary" id="save-assignment">保存模型分配</button></footer>`}
function bindAssignments(){document.getElementById('assignment-bot').onchange=e=>{selectedBot=e.target.value;assignmentDirty=false;render()};document.getElementById('manage-connections').onclick=()=>setView('connections');document.querySelectorAll('[data-slot]').forEach(el=>el.onchange=()=>{const g=el.dataset.slot;assignment()[g]=el.value;assignment()[g+'Value']='';assignmentDirty=true;render()});document.querySelectorAll('[data-slot-value]').forEach(el=>el.oninput=()=>{assignment()[el.dataset.slotValue+'Value']=el.value;assignmentDirty=true;document.getElementById('assignment-status').textContent='有未保存的分配修改'});document.getElementById('voice-reply').onclick=()=>{assignment().voiceEnabled=!assignment().voiceEnabled;assignmentDirty=true;render()};document.getElementById('save-assignment').onclick=()=>{savedAssignments[selectedBot]=structuredClone(assignment());assignmentDirty=false;document.getElementById('assignment-status').textContent='已在原型中保存 · '+selectedBot;toast('模型分配已在原型中保存')};document.getElementById('reset-assignment').onclick=()=>{assignmentState[selectedBot]=structuredClone(savedAssignments[selectedBot]||demoAssignment());assignmentDirty=false;render();toast('已恢复上次保存的分配')}}
function field(label,id,placeholder='',value='',full=false,type='text',hint=''){return `<label class="field ${full?'full':''}"><span>${label}</span><input id="${id}" name="${id}" type="${type}" placeholder="${placeholder}" value="${escapeHTML(value)}" ${id==='connection-name'?'required':''}>${hint?`<small>${hint}</small>`:''}</label>`}
function openEditor(serviceId,connectionId){editorService=service(serviceId);editing=connections.find(c=>c.id===connectionId)||null;const s=editorService,g=s.group;document.getElementById('editor-title').textContent=editing?'编辑连接':'添加 '+s.name;document.getElementById('editor-mark').textContent=s.mark;document.getElementById('editor-subtitle').textContent=s.name+' · '+groups[g].name+(s.tag?' · '+s.tag:'');document.getElementById('save-provider').textContent=editing?'保存修改':'保存连接';const custom=s.id==='azure'||s.id==='azure-tts'?field('资源区域','region','选择或填写区域',editing?.region||'',false):s.id==='volcengine-tts'||s.id==='xfyun-stt'?field('应用 ID','app-id','填写应用 ID','',false):'';const local=s.id==='whisper-local'||s.id.startsWith('ollama');document.getElementById('editor-body').innerHTML=`<p class="form-caption">${editing?`此连接${editing.bots.length?'正被 '+editing.bots.map(escapeHTML).join('、')+' 使用':'尚未分配给机器人'}。修改后会影响使用此连接的配置。`:'保存为一个共享连接，再到“模型分配”中为机器人选择。'}${s.tag==='订阅计划'?' 此类型单独管理订阅计划的地址与凭证。':''}</p><section class="form-section"><h3>连接信息</h3><div class="form-grid">${field('连接名称','connection-name','例如：'+s.name+' · 日常使用',editing?.name||s.name+' · 默认连接',true)}${field(local?'服务地址':'API 地址','base-url',local?'http://localhost:端口':'填写服务地址或保留默认地址',editing?.url||'',true,'text',local?'部署在宿主机或其他设备时，填写后台可访问的地址。':'可为同一服务添加多个连接，区分账号、地区或使用计划。')}${custom}<label class="field ${custom?'':'full'}"><span>${local?'访问密钥':'API Key'} ${local?'<em class="optional">可选</em>':''}</span><span class="secret-control"><input id="api-key" name="api-key" type="password" autocomplete="off" placeholder="${editing?'已保存，留空保留现有凭证':'输入当前服务的凭证'}"><button type="button" class="icon-btn" id="reveal-key" aria-label="显示或隐藏 API Key">${icon('eye')}</button></span><small>${editing?'原有凭证不会回显。':'凭证只用于这个连接。'}</small></label></div></section><section class="form-section"><h3>${g==='tts'?'模型与声音':g==='stt'?'识别设置':'默认模型'}</h3><div class="form-grid">${field(s.id==='azure'?'部署名称':'模型名称','model-name','填写已开通或部署的模型名称',editing?.model||'',g!=='tts')}${g==='tts'?field('音色 ID','voice-id','选择或填写音色 ID',editing?.voice||''):''}${g==='tts'?`<label class="field"><span>语速</span><select id="speech-speed"><option>正常 · 1.0×</option><option>稍慢 · 0.9×</option><option>稍快 · 1.1×</option></select></label><label class="field"><span>输出格式</span><select><option>使用服务默认值</option><option>MP3</option><option>WAV</option></select></label>`:''}${g==='stt'?`<label class="field full"><span>识别语言</span><select><option>自动识别</option><option>中文</option><option>English</option></select><small>使用当前服务支持的语言与识别选项。</small></label>`:''}</div>${g==='chat'?`<div class="capabilities"><label><input type="checkbox" checked> 支持图片输入</label><label><input type="checkbox"> 开启思考</label></div><small style="display:block;margin-top:8px">按实际所选模型的能力配置。</small>`:''}</section><details class="advanced"><summary>高级设置</summary><div class="form-grid">${field('请求超时（秒）','timeout','120','120')}${g==='chat'?field('输出 Token 上限','max-tokens','4096','4096'):field('并发请求上限','concurrency','1','1')}<label class="field full"><span>备注 <em class="optional">可选</em></span><textarea rows="2" placeholder="记录这个连接的用途或使用限制"></textarea></label></div></details><section class="test-block"><header><h3>${g==='tts'?'试听声音':g==='stt'?'试试语音识别':'连接测试'}</h3><span class="badge">原型演示</span></header>${g==='tts'?`<textarea id="test-text" aria-label="试听文字">你好呀，今天也要开心一点。</textarea><div class="test-actions"><button type="button" class="btn sm" id="run-test">${icon('play')}生成试听</button><div class="wave" id="wave">${Array.from({length:16},()=>'<i></i>').join('')}</div><span class="test-time" id="test-time">--:--</span></div>`:g==='stt'?`<label class="upload-zone">${icon('upload')}<span id="audio-upload-label">选择一段音频</span><small>上传音频，查看识别结果</small><input type="file" id="audio-upload" accept="audio/*" style="display:none"></label><div class="test-actions"><button type="button" class="btn sm" id="run-test">${icon('voice')}开始识别</button><small>仅展示测试流程</small></div>`:`<p>${g==='chat'?'验证服务连接后，可以继续测试模型回复。':'验证当前连接与填写的模型是否可用。'}</p><div class="test-actions"><button type="button" class="btn sm" id="run-test">${icon('refresh')}测试连接</button>${g==='chat'?'<button type="button" class="btn sm" id="generation-test">生成测试</button>':''}</div>`}<div class="test-result" id="test-result" role="status"></div></section>${editing?`<div style="margin-top:22px"><button type="button" class="btn ghost sm danger" id="delete-connection">移除这个连接</button></div>`:''}`;document.getElementById('reveal-key').onclick=()=>{const k=document.getElementById('api-key');k.type=k.type==='password'?'text':'password'};document.getElementById('run-test').onclick=()=>runTest(g);const generation=document.getElementById('generation-test');if(generation)generation.onclick=()=>runTest('generation');const upload=document.getElementById('audio-upload');if(upload)upload.onchange=()=>{const f=upload.files[0];if(f)document.getElementById('audio-upload-label').textContent=f.name};const remove=document.getElementById('delete-connection');if(remove)remove.onclick=()=>{if(editing.bots.length){toast('此示例连接仍被机器人使用，请先调整模型分配');return}connections=connections.filter(c=>c.id!==editing.id);document.getElementById('editor').close();render();toast('已从原型中移除连接')};document.getElementById('editor').showModal();icons(document.getElementById('editor'))}
let testTimer;function runTest(kind){const result=document.getElementById('test-result'),button=document.getElementById('run-test');clearTimeout(testTimer);result.className='test-result show';result.textContent='正在演示测试流程…';button.disabled=true;testTimer=setTimeout(()=>{if(!document.getElementById('editor').open)return;button.disabled=false;if(kind==='tts'){result.textContent='试听已生成（示例）。这里将展示音频播放器与耗时。';document.getElementById('wave').classList.add('playing');document.getElementById('test-time').textContent='00:04';setTimeout(()=>document.getElementById('wave')?.classList.remove('playing'),2200)}else if(kind==='stt'){result.textContent='识别结果（示例）：宝宝，我到家啦。'}else if(kind==='generation'){result.textContent='模型回复（示例）：在呢，今天想聊点什么？'}else result.textContent='示例连接验证通过，可继续选择模型并分配给机器人。'},650)}
document.querySelectorAll('[data-view]').forEach(el=>el.onclick=()=>setView(el.dataset.view));document.getElementById('add-provider').onclick=()=>setView('catalog','chat');document.getElementById('test-all').onclick=()=>{toast('正在演示批量检查…');setTimeout(()=>toast('示例检查完成：'+connections.filter(c=>c.status==='good').length+' 个已验证，'+connections.filter(c=>c.status==='warn').length+' 个待检查，'+connections.filter(c=>c.status==='muted').length+' 个未测试'),650)};document.getElementById('theme-toggle').onclick=()=>{document.documentElement.classList.toggle('dark');document.getElementById('theme-toggle').innerHTML=icon(document.documentElement.classList.contains('dark')?'moon':'sun')};document.getElementById('mobile-menu').onclick=()=>document.getElementById('sidebar').classList.toggle('open');document.getElementById('collapse-sidebar').onclick=()=>toast('本原型保留侧栏，便于对照现有页面');document.querySelectorAll('[data-local]').forEach(el=>el.onclick=e=>{e.preventDefault();toast('当前演示仅包含模型供应商页面')});function closeEditor(){clearTimeout(testTimer);document.getElementById('editor').close()}document.getElementById('close-editor').onclick=closeEditor;document.getElementById('cancel-editor').onclick=closeEditor;document.getElementById('editor').addEventListener('cancel',()=>clearTimeout(testTimer));document.getElementById('provider-form').onsubmit=e=>{e.preventDefault();const s=editorService,name=document.getElementById('connection-name').value.trim();if(!name)return;const data={name,model:document.getElementById('model-name').value.trim()||'尚未指定模型',url:document.getElementById('base-url').value.trim(),voice:document.getElementById('voice-id')?.value.trim()||'默认音色'};if(editing)Object.assign(editing,data,{status:'muted'});else connections.push({id:'c'+Date.now(),service:s.id,...data,status:'muted',bots:[]});closeEditor();view='connections';category=s.group;query='';statusFilter='all';render();toast('连接已在原型中保存；未发起真实 API 请求')};render();
</script>
</body></html>
