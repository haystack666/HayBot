<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>HayBot 本地浏览器验收</title><link rel="stylesheet" href="/style.css"><script src="/fixture.js" defer></script></head><body><main><span class="eyebrow">本地合成网页</span><h1>浏览器基础验收</h1><p id="clock"></p><div class="panel"><label for="message">中文输入</label><input id="message" placeholder="输入一段中文"><button id="save">保存</button><p id="result">尚未保存</p></div><div class="panel gesture-fixture"><div><label for="range">拖动滑块</label><input id="range" type="range" min="0" max="100" value="20"><p id="range-result">滑块：20</p><div class="drag-track" id="drag-track"><button id="drag-handle" class="drag-handle">拖我</button></div><p id="drag-result">拖动距离：0</p></div><div><h2>独立滚动区域</h2><div id="nested-scroll" class="scroll-fixture"><div class="wide-fixture" id="nested-feed"></div></div><p id="scroll-result">纵向：0 · 横向：0</p></div></div><a href="/fixture?tab=second" target="_blank">打开第二个标签</a><canvas id="animation" width="600" height="180" aria-label="动态画面"></canvas><div class="panel"><h2>本地视频</h2><video id="video" muted autoplay playsinline width="600" height="180"></video></div><p>下方内容用于滚动测试。</p><div id="feed"></div><iframe title="合成子页面" src="/fixture?iframe=1" width="600" height="200"></iframe></main></body></html>
