<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>浏览器运行时 · HayBot 开发原型</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body><main>
<header><div><span class="eyebrow">HayBot · 开发原型</span><h1>浏览器运行时</h1></div><button id="theme" aria-label="切换主题">切换主题</button></header>
<form id="connect" class="panel"><label for="token">宿主访问码</label><div class="row"><input id="token" type="password" autocomplete="off" required><button>连接</button></div></form>
<section id="environment" class="panel" hidden><div class="row between"><h2>环境检测</h2><span id="environment-state" role="status">检测中</span><button id="details" aria-expanded="false" hidden>查看检测项</button><button id="check">重新检测</button></div><div id="checks"></div><a id="install" class="button" href="https://www.google.cn/chrome/" target="_blank" rel="noopener noreferrer" hidden>前往安装 Google Chrome</a></section>
<section id="workspace" class="panel" hidden>
<div class="row between"><h2>浏览器</h2><span id="session-state">已停止</span><label for="session">资料</label><select id="session"><option value="prototype-a">原型 A</option><option value="prototype-b">原型 B</option></select><button id="start">启动</button><button id="stop" class="danger" disabled>停止</button></div>
<div class="row toolbar"><button id="claim" disabled>接管</button><button id="back" data-control disabled aria-label="后退">←</button><button id="forward" data-control disabled aria-label="前进">→</button><button id="reload" data-control disabled>刷新</button><input id="address" aria-label="网页地址" placeholder="https://" disabled><button id="navigate" data-control disabled>打开</button><button id="fixture" data-control disabled>测试页</button></div>
<div class="row"><div id="tabs" role="tablist" aria-label="浏览器标签页"></div><button id="new-tab" data-control disabled>＋</button><button id="close-tab" data-control disabled>关闭标签</button></div>
<div id="viewer"><div class="row between"><span id="stream-state" role="status">等待浏览器启动</span><button id="reconnect" disabled>重新连接</button><button id="expand" disabled>放大画面</button></div><canvas id="screen" width="1280" height="800" tabindex="0" aria-label="浏览器实时画面，接管后可点击、滚动和键盘输入"></canvas><div class="row typing"><input id="text" placeholder="输入文字" aria-label="向浏览器输入文字" disabled><button id="insert" data-control disabled>输入</button></div></div>
<button id="observe" disabled>查看页面结构</button><pre id="structure" hidden></pre>
</section><p id="notice" role="alert"></p>
</main></body></html>
