services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "0.0.0.0:${PORT:-8080}:8000"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请先运行 python3 scripts/setup.py 生成管理密码}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:0.6b}
      COOKIE_SECURE: "false"
    volumes:
      - app-data:/data
    depends_on:
      ollama:
        condition: service_healthy
      model-init:
        condition: service_completed_successfully
    init: true
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    restart: unless-stopped
    environment:
      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "-1"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
  model-init:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${OLLAMA_MODEL:-qwen3:0.6b}"]
    restart: on-failure:3
    depends_on:
      ollama:
        condition: service_healthy
volumes:
  app-data:
  ollama-data:
