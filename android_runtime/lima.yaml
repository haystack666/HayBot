# HayBot-owned guest: no host home directory mounts.
minimumLimaVersion: 2.0.0
base:
- template:_images/ubuntu-24.04
vmType: vz
propagateProxyEnv: false
# Empty values also suppress macOS system proxy auto-detection in Lima.
env:
  http_proxy: ""
  https_proxy: ""
  ftp_proxy: ""
  HTTP_PROXY: ""
  HTTPS_PROXY: ""
  FTP_PROXY: ""
  all_proxy: ""
  ALL_PROXY: ""
cpus: 4
memory: 6GiB
disk: 40GiB
mounts: []
containerd:
  system: false
  user: false
provision:
- mode: system
  script: |
    #!/bin/bash
    set -euxo pipefail
    export DEBIAN_FRONTEND=noninteractive
    apt-get update
    apt-get install -y docker.io adb python3-venv linux-modules-extra-$(uname -r)
    python3 -m venv /opt/haybot-u2
    /opt/haybot-u2/bin/pip install "uiautomator2==3.7.1"
    systemctl enable --now docker
    echo 'binder_linux' >/etc/modules-load.d/haybot-android.conf
    echo 'options binder_linux devices=binder,hwbinder,vndbinder' >/etc/modprobe.d/haybot-android.conf
    modprobe binder_linux devices=binder,hwbinder,vndbinder
probes:
- script: |
    #!/bin/sh
    test -d /sys/module/binder_linux && sudo -n docker info >/dev/null
  hint: 'Android requires Binder and rootful Docker; inspect cloud-init-output.log.'
